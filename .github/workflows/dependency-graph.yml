name: Dependency graph

# Sin esto, Dependabot no ve la app Android. El grafo de dependencias de GitHub
# solo sabe leer bloques `dependencies` literales de los .gradle(.kts), y aquí
# todo se declara con alias del version catalog (`implementation(libs.foo)`),
# que su parser estático no resuelve. Resultado: cero paquetes Maven en el SBOM
# y, por tanto, cero alertas de seguridad sobre las dependencias de la app.
#
# Ojo con no confundir dos mecanismos: `.github/dependabot.yml` ya declara
# `package-ecosystem: gradle`, pero eso solo abre PRs de *version updates*
# leyendo el manifiesto. Las *alertas de seguridad* salen del grafo de
# dependencias, que es lo que este workflow rellena resolviendo el build de
# verdad y subiendo el snapshot.

on:
  push:
    branches: [main]
  workflow_dispatch:

# El snapshot solo cuenta cuando viene de la rama por defecto, así que esto no
# corre en pull_request a propósito: desde una PR no haría más que gastar CI.

permissions:
  contents: write # necesario para subir el snapshot vía Dependency Submission API

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Mismo apaño que en ci.yml: el de verdad está en .gitignore y el plugin
      # de Google Services aborta la configuración del proyecto si falta.
      - name: Provide non-production Firebase config
        run: cp app/google-services.json.example app/google-services.json

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
