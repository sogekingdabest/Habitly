version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Only group libraries that are designed to move together. Everything else gets its own PR,
      # so an SDK-incompatible AndroidX update cannot block twenty unrelated upgrades again.
      compose-dependencies:
        patterns: ["androidx.compose:*"]
        update-types: ["minor", "patch"]
      firebase-dependencies:
        patterns: ["com.google.firebase:*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      firestore-test-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
